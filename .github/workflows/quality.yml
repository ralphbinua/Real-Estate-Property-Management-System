name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check --settings=core.test_settings
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run --settings=core.test_settings
      - name: Run backend regression tests
        run: python manage.py test --settings=core.test_settings --noinput

  frontend-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies for browser fixtures
        run: python -m pip install -r ../backend/requirements.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke and five-role layout checks
        run: npm run test:ui
      - name: Save synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review
          path: frontend/.ui-review/
          if-no-files-found: ignore
